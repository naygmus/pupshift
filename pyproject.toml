[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pupshift"
version = "1.0.0"
description = "Layout switcher for last word / selection (Puppy Linux, X11)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "pupshift contributors"}]
classifiers = [
    "Environment :: X11 Applications",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
